name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # End-to-end against a production build with recorded data. Without PayPal secrets the paying
      # flows skip; ranking, injection drills and the pause switch still run.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
