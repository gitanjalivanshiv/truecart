name: keepalive
# Render free instances sleep after 15 minutes idle. Ping the health check so judges don't wait for a cold start.
# Set the repository variable DEMO_URL (e.g. https://truecart.onrender.com) to enable.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.DEMO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.DEMO_URL }}/api/health" > /dev/null
