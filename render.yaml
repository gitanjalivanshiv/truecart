# Render Blueprint (stub). Docs: https://render.com/docs/blueprint-spec — [VERIFY] fields and plan before first deploy.
services:
  - type: web
    name: truecart
    runtime: node
    plan: free # SPEC 13.3: paid instance vs free tier is an open decision (free spins down; disk not persistent)
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CHANNEL3_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DEMO_WALLET_TOKEN
        sync: false
      - key: AGENT_DAILY_TURNS
        value: "300"
      - key: MASK_BRANDS
        value: "true"
      - key: DEMO_MODE
        value: "true"
